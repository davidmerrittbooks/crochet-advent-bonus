<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you for crocheting along</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#0f4d2c;color:#fff7e0;text-align:center}
  .box{max-width:560px;margin:0 auto;padding:48px 22px}
  h1{color:#f3c14b;font-size:34px;margin:0 0 14px}
  p{font-size:19px;line-height:1.5}
  a.btn{display:inline-block;margin-top:22px;background:#c4122f;color:#fff;text-decoration:none;font-weight:bold;font-size:20px;padding:16px 26px;border-radius:12px;border:3px solid #f3c14b}
</style>
</head>
<body>
<div class="box">
  <h1>Thank you for crocheting along!</h1>
  <p>I hope December felt a little warmer with the garland growing day by day.</p>
  <p>Tell us how it went: what worked and what we can do better. Your honest opinion helps other crocheters.</p>
  <a class="btn" id="go" href="https://www.amazon.com/s?k=Crochet+Advent+Calendar+for+Advanced+Crocheters">TELL US YOUR OPINION</a>
</div>
<script>
  // Dopo la pubblicazione: scrivi qui l'ASIN del libro (10 caratteri, es. B0XXXXXXXX) e il pulsante porta alla pagina giusta.
  var ASIN = "";
  if (ASIN) { document.getElementById("go").href = "https://www.amazon.com/review/create-review?asin=" + ASIN; }
</script>
</body>
</html>
